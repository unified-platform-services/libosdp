name: Publish PlatformIO

on:
  workflow_dispatch:
  push:
    # Publish directly off the pushed tag. Do not use workflow_run here:
    # GitHub only registers workflow_run listeners declared on the default
    # branch, so this file -- which lives only on the release branch --
    # would never be triggered at all.
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Check that the publish token is configured
      env:
        PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
      run: |
        if [ -z "${PLATFORMIO_AUTH_TOKEN}" ]; then
          echo "PLATFORMIO_AUTH_TOKEN is not set for this repository" >&2
          exit 1
        fi

    - name: Check that library.json agrees with the tag
      if: github.ref_type == 'tag'
      run: |
        set -euo pipefail
        # Without this the publish below would push whatever version
        # library.json happens to carry, and a stale one would be absorbed by
        # the already-exists path at the end of this job as a false success.
        tag_version="${GITHUB_REF_NAME#v}"
        lib_version="$(perl -ne 'print $1 if (/^  "version": "(\d+\.\d+\.\d+)",$/)' library.json)"
        if [ "${tag_version}" != "${lib_version}" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match library.json version ${lib_version}" >&2
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install PlatformIO CLI
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Publish to PlatformIO Registry
      id: publish
      env:
        PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
      continue-on-error: true
      run: |
        set -o pipefail
        pio package publish --type library --no-interactive --owner sidcha 2>&1 \
          | tee publish-platformio.log

    - name: Accept an already published version when re-running
      run: |
        set -euo pipefail
        if [ "${{ steps.publish.outcome }}" = "success" ]; then
          exit 0
        fi
        if grep -Eqi 'already exists|already published|version.+exists' publish-platformio.log; then
          echo "This version is already in the registry; re-run satisfied."
          exit 0
        fi
        echo "PlatformIO publish failed" >&2
        exit 1
