name: Cross Platform Build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  native:
    name: Native ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,        runner: ubuntu-latest,    image: quay.io/pypa/manylinux_2_28_x86_64,  max_glibc: "2.28" }
          - { rid: linux-arm64,      runner: ubuntu-24.04-arm, image: quay.io/pypa/manylinux_2_28_aarch64, max_glibc: "2.28" }
          - { rid: linux-musl-x64,   runner: ubuntu-latest,    image: quay.io/pypa/musllinux_1_2_x86_64 }
          - { rid: linux-musl-arm64, runner: ubuntu-24.04-arm, image: quay.io/pypa/musllinux_1_2_aarch64 }
          # The dockcross image ships qemu-arm and sets QEMU_LD_PREFIX, so the
          # cross-built ABI probe runs without any host emulator setup.
          - { rid: linux-arm,        runner: ubuntu-latest,    image: dockcross/linux-armv7-lts,           max_glibc: "2.31", probe_runner: qemu-arm }
          - { rid: win-x64,          runner: windows-latest }
          - { rid: win-arm64,        runner: windows-11-arm }
          - { rid: osx-arm64,        runner: macos-14 }
          - { rid: osx-x64,          runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      # Containers are driven with `docker run` rather than `container:` so the
      # same command reproduces locally, and so JavaScript actions never have to
      # run inside a musl image. Running as the runner user keeps the files
      # written into the bind mount uploadable.
      - name: Build in ${{ matrix.image }}
        if: matrix.image
        shell: bash
        run: |
          set -euo pipefail
          rev="$(git describe --tags --long --always --abbrev=7)"
          tag="$(git describe --exact-match --tags HEAD 2>/dev/null || true)"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src \
            -e LIBOSDP_GIT_REV="$rev" -e LIBOSDP_GIT_TAG="$tag" \
            -e MAX_GLIBC="${{ matrix.max_glibc }}" -e BUILD_DIR=/tmp/build \
            -e ABI_PROBE_RUNNER="${{ matrix.probe_runner }}" \
            "${{ matrix.image }}" \
            scripts/build-native.sh "${{ matrix.rid }}" "/src/native-${{ matrix.rid }}"
      - name: Build on runner
        if: ${{ !matrix.image }}
        shell: bash
        run: scripts/build-native.sh "${{ matrix.rid }}" "native-${{ matrix.rid }}"
      - name: Check the Windows DLL needs no VC++ redistributable
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.* -property installationPath
          $hostDir = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'Hostarm64' } else { 'Hostx64' }
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match "\\$hostDir\\" } | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $machine = if ("${{ matrix.rid }}" -eq 'win-arm64') { 'AA64 machine \(ARM64\)' } else { '8664 machine \(x64\)' }
          $headers = & $dumpbin.FullName /headers "native-${{ matrix.rid }}\lib\osdp.dll"
          if ($LASTEXITCODE -ne 0) { throw "dumpbin /headers failed with exit code $LASTEXITCODE" }
          if (-not ($headers -match $machine)) { throw "osdp.dll is not built for ${{ matrix.rid }}" }
          $deps = & $dumpbin.FullName /dependents "native-${{ matrix.rid }}\lib\osdp.dll"
          $deps
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          if (-not ($deps -match '^\s+\S+\.dll\s*$')) { throw "dumpbin listed no dependencies" }
          if ($deps -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { throw "osdp.dll links the dynamic CRT" }
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: native-${{ matrix.rid }}/
          if-no-files-found: error

  # MSYS2 (MinGW/UCRT/Clang) exercises the libosdp core on non-MSVC Windows
  # backends. These toolchains do not define _MSC_VER, so the `NOT MSVC` gates
  # in CMakeLists.txt would normally pull in utils/, unit-tests, and examples
  # — all of which rely on POSIX APIs (fork, sys/select.h, System V IPC) that
  # MSYS2's native Windows subsystems do not provide. OPT_OSDP_LIB_ONLY=ON
  # skips those subdirectories so only src/ is built, which is what these
  # toolchains can realistically support.
  msys2_lib_only:
    name: MSYS2 ${{ matrix.name }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MinGW64 GCC
            msystem: MINGW64
            packages: >-
              mingw-w64-x86_64-gcc
              mingw-w64-x86_64-cmake
              mingw-w64-x86_64-ninja
          - name: UCRT64 GCC
            msystem: UCRT64
            packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-ninja
          - name: CLANG64 Clang
            msystem: CLANG64
            packages: >-
              mingw-w64-clang-x86_64-clang
              mingw-w64-clang-x86_64-cmake
              mingw-w64-clang-x86_64-ninja
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: true
          install: ${{ matrix.packages }}
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DOPT_OSDP_LIB_ONLY=ON .
      - name: Build
        run: cmake --build build --parallel

  # A bare-metal ARM toolchain models two things the x86-64 glibc build cannot:
  # newlib types uint32_t as `unsigned long`, so a `%d`/`%u` applied to a
  # uint32_t is a -Wformat error here while staying silent on the host; and it
  # is the toolchain family our embedded targets actually use. Compile-only —
  # there is nothing to link or run against.
  bare_metal_arm:
    name: Bare-metal ARM (type/format checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install arm-none-eabi toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Generate osdp_config.h
        run: cmake -B build -DOPT_OSDP_LIB_ONLY=ON .
      - name: Compile core for arm-none-eabi
        run: |
          for f in src/*.c; do
            arm-none-eabi-gcc -c -o /dev/null "$f" \
              -Iinclude -Isrc -Isrc/crypto -Iutils/include -Ibuild/include \
              -std=c11 -Wall -Wextra -Wformat=2 -Werror \
              -Wno-unused-parameter -Wno-format-nonliteral
          done
