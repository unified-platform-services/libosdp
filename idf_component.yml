#
# ESP Component Registry manifest. Lives at the repo root because that is the
# ESP-IDF component root (see the ESP_PLATFORM branch in CMakeLists.txt); the
# component definition itself is in esp-idf/.
#
# No `version` key: the release workflow passes it from the git tag, and the
# upload action only fills in a version the manifest does not already state --
# it cannot override one. Leaving it out is what keeps the published version
# tied to the tag that preflight already checked against CMakeLists.txt,
# pyproject.toml, library.json and platformio/osdp_config.h. A manual
# `compote component upload` must therefore pass --version explicitly.

name: libosdp

description: >-
  Open Supervised Device Protocol (OSDP, IEC 60839-11-5) library for access
  control. Implements both the CP (control panel) and PD (peripheral device)
  roles, including Secure Channel, over any byte transport -- typically RS-485.

license: Apache-2.0

maintainers:
  - Siddharth Chandrasekaran <sidcha.dev@gmail.com>

url: https://doc.osdp.dev/
documentation: https://doc.osdp.dev/
repository: https://github.com/osdp-dev/libosdp.git
issues: https://github.com/osdp-dev/libosdp/issues

tags:
  - osdp
  - access-control
  - physical-security
  - rs485
  - protocol
  - secure-channel
  - iec-60839

# No `targets` key: the library is portable C with no target-specific code, and
# the glue in esp-idf/src/osdp_esp.c uses only esp_timer and esp_random, which
# every ESP-IDF target provides. Omitting the key advertises all targets.

dependencies:
  idf: ">=5.0"

files:
  # The repo carries a full standalone CMake/Make build, a Zephyr module, a
  # PlatformIO library, a Python binding and a test suite. None of that is
  # reachable from the ESP-IDF component, so keep it out of the package rather
  # than shipping a tarball that is mostly dead weight.
  #
  # DEFAULT_EXCLUDE already covers .git, .github, build/, dist/, __pycache__,
  # .vscode, sdkconfig and managed_components -- not repeated here.
  exclude:
    - "docs/**/*"
    - "doc/**/*"
    - "tests/**/*"
    - "python/**/*"
    - "zephyr/**/*"
    - "platformio/**/*"
    - "misc/**/*"
    - "scripts/**/*"
    - "coverage/**/*"
    - "examples/**/*"
    - "config.make"
    - "library.json"

    # utils/ is a submodule and only its src/ and include/ are compiled. Its
    # test fixtures are 95% of the packed bytes and unreachable from the
    # component -- excluding them is the single biggest size win here.
    - "utils/tests/**/*"

    # The packer globs the working tree rather than git (see `use_gitignore`
    # below), so anything a developer happens to have lying around is packed.
    # CI packs a fresh checkout and never sees these, but a hand-run
    # `compote component pack` would otherwise publish local editor caches,
    # agent scratch space and internal notes to a public registry.
    - ".cache/**/*"
    - ".claude/**/*"
    - ".superpowers/**/*"
    - ".pytest_cache/**/*"
    - "dist/**/*"
    - "CLAUDE.md"

  # `use_gitignore` is deliberately not set: it makes the packer skip
  # DEFAULT_EXCLUDE entirely, which would pack .git/ into the archive.
  #
  # utils/ is a git submodule and needs no `include` entry -- the packer globs
  # the working tree, so a recursive checkout carries it. It does mean the
  # upload must be run from a `--recursive` clone; a bare clone would silently
  # publish a component that cannot compile.
